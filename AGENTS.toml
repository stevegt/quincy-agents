[config]
module_dir = ".mogent/modules"

[order]
categories = ["identity", "instructions", "constraints", "format"]

# Identity - who you are
[category.identity]
[[category.identity.module]]
name = "identity"
source = "identity.md"

# Instructions - what you do
[category.instructions]
[[category.instructions.module]]
name = "instructions"
source = "instructions.md"

# Constraints - what you can't do
[category.constraints]
[[category.constraints.module]]
name = "constraints"
source = "constraints.md"

# Format - how you respond
[category.format]
[[category.format.module]]
name = "format"
source = "format.md"

[activate]
scopes = []

[output]
path = "AGENTS.md"
